services:
  bot:
    build: .
    container_name: botsite-bot
    restart: always
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - FORCE_REINIT_DB=${FORCE_REINIT_DB:-1}
    command: sh -c "python db_init.py && python botSite.py"

volumes:
  mysql_data:
